name: repo hygiene

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  planning-docs:
    name: no agent planning documents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for planning artefacts
        env:
          PLANNING_DOCS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/check-no-planning-docs.sh

  docs-follow-change:
    name: documentation follows the change
    runs-on: ubuntu-latest
    # Deliberately advisory, and it reports two different kinds of thing. A
    # broken website link is a fact; whether a change needs describing on the
    # website is a judgement call about a repository one over, which a
    # contributor without commit rights there cannot act on anyway. A check that
    # blocks on a judgement call gets satisfied rather than read, so this one
    # warns and writes a summary and never fails the PR.
    # .github/check-docs-follow-change.sh explains what rotted to earn it.
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compare the documentation and the website against this change
        env:
          DOCS_FOLLOW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Read through the environment, never interpolated into the script:
          # a pull request body is whatever an author typed.
          DOCS_FOLLOW_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          set +e
          report="$(.github/check-docs-follow-change.sh 2>&1)"
          status=$?
          set -e

          echo "${report}"

          {
            echo "### Documentation follows the change"
            echo
            echo '```'
            echo "${report}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          # A workflow-command annotation is one line, so it points at the
          # summary rather than trying to carry the report.
          case "${status}" in
            0) ;;
            1) echo "::warning title=documentation and the website may need to follow this change::see this job's summary for what to update, here and in srcfl/ftw-web" ;;
            *) echo "::warning title=the documentation check did not run::exit ${status} — see this job's summary" ;;
          esac
